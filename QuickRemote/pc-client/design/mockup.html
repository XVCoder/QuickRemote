<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickRemote PC - Design Mockup</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap');

  :root {
    --bg-primary: #0f1117;
    --bg-secondary: #161922;
    --bg-card: #1c2030;
    --bg-hover: #232838;
    --border: #2a2f3e;
    --border-light: #353b4d;
    --text-primary: #e4e6eb;
    --text-secondary: #9ca3af;
    --text-muted: #6b7280;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --accent-dim: #1e3a5f;
    --success: #10b981;
    --success-dim: #064e3b;
    --warning: #f59e0b;
    --warning-dim: #78350f;
    --danger: #ef4444;
    --danger-dim: #7f1d1d;
    --radius: 8px;
    --radius-sm: 4px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
  }

  .window {
    width: 520px;
    height: 680px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  /* Title Bar */
  .title-bar {
    height: 38px;
    background: var(--bg-primary);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px 0 16px;
    border-bottom: 1px solid var(--border);
    -webkit-app-region: drag;
  }
  .title-bar .title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    letter-spacing: 0.3px;
  }
  .title-bar .title span { color: var(--accent); font-weight: 600; }
  .window-controls { display: flex; gap: 8px; -webkit-app-region: no-drag; }
  .window-controls button {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
  }
  .btn-minimize { background: #f59e0b; }
  .btn-close { background: #ef4444; }

  /* Content */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }

  /* Status Card */
  .status-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  .status-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .status-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    font-weight: 500;
  }
  .status-dot {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 500;
  }
  .status-dot::before {
    content: '';
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
    animation: pulse 2s infinite;
  }
  .status-dot.disconnected::before { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
  .status-dot.connecting::before { background: var(--warning); box-shadow: 0 0 8px var(--warning); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .status-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 16px;
    font-size: 12px;
  }
  .info-item { display: flex; flex-direction: column; gap: 2px; }
  .info-label { color: var(--text-muted); font-size: 11px; }
  .info-value {
    color: var(--text-primary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }

  /* Section Title */
  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    font-weight: 500;
    margin-bottom: 8px;
    padding-left: 2px;
  }

  /* Session Card */
  .session-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.15s;
  }
  .session-card:hover { background: var(--bg-hover); }
  .session-info { display: flex; flex-direction: column; gap: 4px; }
  .session-device {
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .session-device .device-icon {
    width: 16px; height: 16px;
    background: var(--accent-dim);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
  }
  .session-meta {
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
  }
  .session-stats { text-align: right; }
  .session-time {
    font-size: 12px;
    color: var(--text-secondary);
    font-family: 'JetBrains Mono', monospace;
  }
  .session-traffic {
    font-size: 10px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 2px;
  }

  .empty-state {
    text-align: center;
    padding: 24px 0;
    color: var(--text-muted);
    font-size: 12px;
  }

  /* RDP Status */
  .rdp-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 6px;
  }
  .rdp-label { font-size: 12px; color: var(--text-secondary); }
  .rdp-value {
    font-size: 12px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .rdp-value.ok { color: var(--success); }
  .rdp-value.warn { color: var(--warning); }
  .rdp-value::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  /* Settings */
  .settings-group {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 16px;
  }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
  }
  .setting-row + .setting-row { border-top: 1px solid var(--border); }
  .setting-label { font-size: 12px; color: var(--text-secondary); }
  .setting-input {
    background: var(--bg-primary);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 5px 8px;
    width: 200px;
    text-align: right;
    outline: none;
  }
  .setting-input:focus { border-color: var(--accent); }

  .toggle {
    position: relative;
    width: 36px; height: 20px;
    background: var(--border-light);
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .toggle.active { background: var(--accent); }
  .toggle::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    background: white;
    border-radius: 50%;
    transition: transform 0.2s;
  }
  .toggle.active::after { transform: translateX(16px); }

  /* Buttons */
  .actions {
    display: flex;
    gap: 8px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    background: var(--bg-primary);
  }
  .btn {
    flex: 1;
    padding: 8px 14px;
    border: 1px solid var(--border-light);
    border-radius: var(--radius-sm);
    background: var(--bg-card);
    color: var(--text-primary);
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { background: var(--bg-hover); border-color: var(--accent); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .btn.primary:hover { background: var(--accent-hover); }

  /* Scrollbar */
  .content::-webkit-scrollbar { width: 6px; }
  .content::-webkit-scrollbar-track { background: transparent; }
  .content::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
</style>
</head>
<body>

<div class="window">
  <!-- Title Bar -->
  <div class="title-bar">
    <div class="title"><span>QuickRemote</span> PC</div>
    <div class="window-controls">
      <button class="btn-minimize"></button>
      <button class="btn-close"></button>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <!-- Server Status -->
    <div class="status-card">
      <div class="status-header">
        <span class="status-label">服务器状态</span>
        <span class="status-dot">已连接</span>
      </div>
      <div class="status-info">
        <div class="info-item">
          <span class="info-label">服务器地址</span>
          <span class="info-value">relay.example.com:8443</span>
        </div>
        <div class="info-item">
          <span class="info-label">设备 ID</span>
          <span class="info-value">PC-OFFICE-001</span>
        </div>
        <div class="info-item">
          <span class="info-label">心跳</span>
          <span class="info-value">2s 前</span>
        </div>
        <div class="info-item">
          <span class="info-label">版本</span>
          <span class="info-value">v1.0.0</span>
        </div>
      </div>
    </div>

    <!-- Active Sessions -->
    <div class="section-title">当前远程会话</div>
    <div class="session-card">
      <div class="session-info">
        <div class="session-device">
          <div class="device-icon">📱</div>
          Pixel 8 Pro
        </div>
        <div class="session-meta">192.168.1.5 · RDP Active</div>
      </div>
      <div class="session-stats">
        <div class="session-time">15:32</div>
        <div class="session-traffic">↑ 1.2MB ↓ 3.5MB</div>
      </div>
    </div>
    <div class="session-card">
      <div class="session-info">
        <div class="session-device">
          <div class="device-icon">📱</div>
          iPad Pro
        </div>
        <div class="session-meta">10.0.0.12 · RDP Active</div>
      </div>
      <div class="session-stats">
        <div class="session-time">02:18</div>
        <div class="session-traffic">↑ 0.3MB ↓ 0.8MB</div>
      </div>
    </div>

    <!-- RDP Status -->
    <div style="margin-top:16px;"></div>
    <div class="section-title">RDP 配置</div>
    <div class="rdp-row">
      <span class="rdp-label">RDP 服务</span>
      <span class="rdp-value ok">已启用 (端口 3389)</span>
    </div>
    <div class="rdp-row">
      <span class="rdp-label">防火墙规则</span>
      <span class="rdp-value ok">已放行</span>
    </div>

    <!-- Settings -->
    <div style="margin-top:16px;"></div>
    <div class="section-title">设置</div>
    <div class="settings-group">
      <div class="setting-row">
        <span class="setting-label">服务器地址</span>
        <input class="setting-input" value="https://relay.example.com:8443">
      </div>
      <div class="setting-row">
        <span class="setting-label">预共享密钥</span>
        <input class="setting-input" type="password" value="••••••••••••">
      </div>
      <div class="setting-row">
        <span class="setting-label">开机自启动</span>
        <div class="toggle active"></div>
      </div>
      <div class="setting-row">
        <span class="setting-label">启动时检查更新</span>
        <div class="toggle active"></div>
      </div>
      <div class="setting-row">
        <span class="setting-label">自动上传错误日志</span>
        <div class="toggle"></div>
      </div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="actions">
    <button class="btn">更新记录</button>
    <button class="btn">检查更新</button>
    <button class="btn primary">保存设置</button>
  </div>
</div>

</body>
</html>
